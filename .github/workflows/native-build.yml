name: Native ARM64 build

on:
  workflow_dispatch:
    inputs:
      with_gprs:
        description: Build and run regression checks for optional packet components
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      OSMO_LAB_STATE: /tmp/osmolab-ci
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Homebrew dependencies
        run: brew bundle --file=Brewfile
      - name: Host and dependencies
        run: ./lab doctor
      - name: Build and run component checks (functional timer checks on VM)
        env:
          WITH_GPRS: ${{ inputs.with_gprs }}
        run: |
          if [ "$WITH_GPRS" = "true" ]; then
            ./lab build --jobs 3 --timer-checks functional --with-gprs
          else
            ./lab build --jobs 3 --timer-checks functional
          fi
      - name: Render example profile with RF locked
        run: |
          cp lab.example.json lab.json
          ./lab configure
      - name: Native core and BTS configuration smoke check (no SDR)
        run: python3 -B scripts/smoke_native.py
      - name: Compile optional gateway protocol probe (no network setup)
        if: ${{ inputs.with_gprs }}
        run: |
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from common import state_dir
          from packet_probe import build_http_probe
          build_http_probe(state_dir())
          PY
